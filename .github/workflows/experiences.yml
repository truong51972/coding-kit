name: Experiences tests

on:
  pull_request:
    paths:
      - "skills/experiences/**"
      - "README.md"
      - ".github/workflows/experiences.yml"
  push:
    branches: [main]
    paths:
      - "skills/experiences/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install "pytest>=8,<10"
      - name: Compile scripts
        run: python -m compileall -q skills/experiences
      - name: Run experience regression tests
        run: python -m pytest -q skills/experiences/tests
