name: Context Management memory tests

on:
  pull_request:
    paths:
      - "skills/context-management/**"
      - "README.md"
      - ".github/workflows/experiences.yml"
  push:
    branches: [main]
    paths:
      - "skills/context-management/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install "pytest>=8,<10"
      - name: Compile scripts
        run: python -m compileall -q skills/context-management
      - name: Parse OpenCode TypeScript hook adapters
        run: |
          npx --yes esbuild@0.25.12 skills/context-management/hooks/opencode/v1.ts --bundle --platform=node --external:@opencode-ai/plugin --outfile=/tmp/context-opencode-v1.js
          npx --yes esbuild@0.25.12 skills/context-management/hooks/opencode/v2.ts --bundle --platform=node --external:@opencode/plugin --outfile=/tmp/context-opencode-v2.js
      - name: Exercise bundled OpenCode hook adapter behavior
        run: node skills/context-management/tests/opencode_adapter_smoke.cjs /tmp/context-opencode-v1.js /tmp/context-opencode-v2.js
      - name: Run context and experience regression tests
        run: python -m pytest -q skills/context-management/tests
